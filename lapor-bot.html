<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Lapor Sarpras GKPI</title>

<!-- PWA -->
<meta name="theme-color" content="#1e3a8a" />
<meta name="color-scheme" content="light" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lapor Sarpras" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />

<style>
  :root{
    --primary:#1e3a8a;
    --primary-light:#1e40af;
    --accent:#fbbf24;
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#64748b;
    --border:#e5e7eb;
    --success:#22c55e;
    --danger:#ef4444;
    --warning:#f59e0b;
    --info:#3b82f6;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{
    display:flex; flex-direction:column;
    height:100vh; max-width:560px;
    margin:0 auto; background:var(--card);
    box-shadow:0 0 30px rgba(0,0,0,.06);
  }
  /* Header - GRADIENT SAMA DENGAN SIDEBAR DASHBOARD */
  .app-header{
    background:linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
    color:#fff; padding:16px 20px;
    flex-shrink:0;
    box-shadow:0 2px 8px rgba(30,58,138,.25);
    display:flex; align-items:center; gap:12px;
  }
  .app-header .logo{
    width:42px; height:42px;
    background:#fff; border-radius:50%;
    padding:3px; flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center;
  }
  .app-header .logo img{
    width:100%; height:100%;
    border-radius:50%; object-fit:contain;
  }
  .app-header .header-text{ flex:1; min-width:0; }
  .app-header .title{
    font-size:1.05rem; font-weight:700;
    display:flex; align-items:center; gap:6px;
  }
  .app-header .subtitle{
    font-size:.75rem; opacity:.85; margin-top:1px;
    color:#fcd34d;
  }
  .chat-body{
    flex:1; overflow-y:auto; padding:16px;
    background:linear-gradient(180deg,#f8fafc 0%, #f1f5f9 100%);
    display:flex; flex-direction:column; gap:12px;
    scroll-behavior:smooth;
  }
  .chat-body::-webkit-scrollbar{ width:6px; }
  .chat-body::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:3px; }
  .msg{
    max-width:85%; padding:12px 16px; border-radius:16px;
    font-size:.92rem; line-height:1.5; word-wrap:break-word;
    animation:slideIn .25s ease;
  }
  @keyframes slideIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .msg.bot{
    align-self:flex-start; background:#fff; color:var(--text);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .msg.user{
    align-self:flex-end;
    background:linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
    color:#fff; border-bottom-right-radius:4px;
    box-shadow:0 2px 6px rgba(30,58,138,.25);
  }
  .msg b{ color:var(--primary); font-weight:600; }
  .msg.user b{ color:#fff; }
  .msg .small{ font-size:.78rem; color:var(--muted); margin-top:6px; }
  .typing{ display:flex; gap:4px; padding:14px 18px; align-self:flex-start; background:#fff; border:1px solid var(--border); border-radius:16px; border-bottom-left-radius:4px; }
  .typing span{ width:8px; height:8px; background:#94a3b8; border-radius:50%; animation:bounce 1.4s infinite; }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:.4; }
    30%{ transform:translateY(-6px); opacity:1; }
  }
  .quick-actions{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-top:4px;
    animation:slideIn .3s ease;
  }
  .quick-btn{
    background:#fff; color:var(--primary);
    border:1.5px solid var(--primary);
    padding:9px 14px; border-radius:18px;
    font-size:.85rem; font-weight:600; cursor:pointer;
    transition:all .15s;
    font-family:inherit;
  }
  .quick-btn:hover, .quick-btn:active{
    background:var(--primary); color:#fff;
    transform:translateY(-1px);
  }
  .quick-btn.prior-kritis{ border-color:#dc2626; color:#dc2626; }
  .quick-btn.prior-kritis:hover{ background:#dc2626; color:#fff; }
  .quick-btn.prior-tinggi{ border-color:#f59e0b; color:#f59e0b; }
  .quick-btn.prior-tinggi:hover{ background:#f59e0b; color:#fff; }
  .quick-btn.prior-sedang{ border-color:#3b82f6; color:#3b82f6; }
  .quick-btn.prior-sedang:hover{ background:#3b82f6; color:#fff; }
  .quick-btn.prior-rendah{ border-color:#10b981; color:#10b981; }
  .quick-btn.prior-rendah:hover{ background:#10b981; color:#fff; }
  .quick-btn.danger{ border-color:var(--danger); color:var(--danger); }
  .quick-btn.danger:hover{ background:var(--danger); color:#fff; }
  .quick-btn.success{ border-color:var(--success); color:var(--success); }
  .quick-btn.success:hover{ background:var(--success); color:#fff; }
  .quick-btn.primary{
    background:linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
    color:#fff; border-color:var(--primary);
  }
  .quick-btn.primary:hover{
    background:linear-gradient(180deg, #1e40af 0%, #1e3a8a 100%);
  }
  .review-card{
    background:#f8fafc; border:1px solid var(--border);
    border-radius:12px; padding:14px;
    margin-top:8px;
  }
  .review-card .row{
    display:flex; padding:6px 0;
    border-bottom:1px dashed var(--border);
  }
  .review-card .row:last-child{ border-bottom:none; }
  .review-card .lbl{ width:90px; color:var(--muted); font-size:.82rem; flex-shrink:0; }
  .review-card .val{ flex:1; font-size:.88rem; font-weight:600; color:var(--text); }
  .input-area{
    flex-shrink:0; padding:12px;
    background:#fff; border-top:1px solid var(--border);
    display:none; gap:8px;
  }
  .input-area.show{ display:flex; }
  .input-area input, .input-area textarea{
    flex:1; padding:11px 16px; border:1px solid var(--border);
    border-radius:22px; outline:none; font-size:.92rem;
    font-family:inherit; background:#f8fafc;
    resize:none;
  }
  .input-area input:focus, .input-area textarea:focus{
    border-color:var(--primary); background:#fff;
  }
  .input-area button{
    background:linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
    color:#fff; border:none; border-radius:50%;
    width:44px; height:44px; cursor:pointer;
    font-size:1.1rem; flex-shrink:0;
    box-shadow:0 2px 6px rgba(30,58,138,.3);
  }
  .input-area button:disabled{ opacity:.5; cursor:not-allowed; }
  .result-overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.6);
    display:none; align-items:center; justify-content:center;
    z-index:1000; padding:20px;
    animation:fadeIn .2s ease;
  }
  .result-overlay.show{ display:flex; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .result-card{
    background:#fff; border-radius:20px; padding:30px 24px;
    max-width:380px; width:100%;
    text-align:center;
    animation:slideUp .3s ease;
  }
  @keyframes slideUp{
    from{ opacity:0; transform:translateY(20px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .result-card .icon{ font-size:3.5rem; margin-bottom:12px; }
  .result-card h3{ color:var(--primary); margin-bottom:10px; font-size:1.3rem; }
  .result-card .no{ font-size:1.8rem; font-weight:700; color:var(--success); margin:14px 0; }
  .result-card p{ color:var(--muted); font-size:.9rem; margin-bottom:18px; line-height:1.5; }
  .result-card .btn-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  @media (max-width:480px){
    .app{ max-width:100%; box-shadow:none; }
    .msg{ font-size:.9rem; }
    .quick-btn{ font-size:.82rem; padding:8px 12px; }
    .app-header .logo{ width:38px; height:38px; }
    .app-header .title{ font-size:1rem; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Header dengan Logo GKPI -->
  <div class="app-header">
    <div class="logo">
      <img src="assets/logo_gkpi.png" alt="Logo GKPI" onerror="this.style.display='none'; this.parentElement.innerHTML='🔧'" />
    </div>
    <div class="header-text">
      <div class="title">Lapor Sarpras GKPI</div>
      <div class="subtitle">Jemaat Khusus Depok · Anonim & Aman</div>
    </div>
  </div>

  <!-- Chat body -->
  <div class="chat-body" id="chatBody"></div>

  <!-- Input area (hidden by default) -->
  <div class="input-area" id="inputArea">
    <input type="text" id="inputField" placeholder="Ketik di sini..." />
    <button id="sendBtn" onclick="handleInputSubmit()">➤</button>
  </div>
</div>

<!-- Result overlay -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card" id="resultCard"></div>
</div>

<script>
// =========================================
// ⚠️ KONFIGURASI — EDIT 2 BARIS INI
// =========================================
const LAPOR_API_URL = 'https://script.google.com/macros/s/AKfycbxe2A3tHw6BbcAl0CJMPcHBq75ly0VUDs_BTxSXb5iYQ94ieNo6FG8GGncD5w3MF3se/exec';
const LAPOR_API_KEY = 'sarpras2026';
// =========================================

let state = 'greeting';
let formData = { tanggal:'', lokasi:'', deskripsi:'', prioritas:'' };

const LOKASI_LIST = [
  'Sanctuary / R. Ibadah',
  'R. Konsistori',
  'R. SM Besar',
  'R. SM Kelas Kecil',
  'R. GSM',
  'Aula',
  'Toilet',
  'Halaman / Parkir',
  'Dapur',
  'Rumah Pastori',
  'Lantai 1',
  'Jalan Masuk Gereja'
];

const PRIORITAS_LIST = [
  { val:'Kritis',  label:'🔴 Kritis',  desc:'Bahaya / Darurat', cls:'prior-kritis' },
  { val:'Tinggi',  label:'🟠 Tinggi',  desc:'Ganggu aktivitas', cls:'prior-tinggi' },
  { val:'Sedang',  label:'🔵 Sedang',  desc:'Bisa ditunggu',    cls:'prior-sedang' },
  { val:'Rendah',  label:'🟢 Rendah',  desc:'Tidak urgent',     cls:'prior-rendah' }
];

const $body = document.getElementById('chatBody');
const $input = document.getElementById('inputField');
const $inputArea = document.getElementById('inputArea');
const $sendBtn = document.getElementById('sendBtn');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function scrollBottom(){ setTimeout(()=> { $body.scrollTop = $body.scrollHeight; }, 50); }

function addMsg(role, html, actions){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = html;
  $body.appendChild(div);
  if(actions && actions.length){
    const wrap = document.createElement('div');
    wrap.className = 'quick-actions';
    actions.forEach(a => {
      const btn = document.createElement('button');
      btn.className = 'quick-btn ' + (a.cls || '');
      btn.innerHTML = a.label;
      btn.onclick = ()=> { disableAllQuickButtons(); a.onClick(); };
      wrap.appendChild(btn);
    });
    $body.appendChild(wrap);
  }
  scrollBottom();
}
function disableAllQuickButtons(){
  document.querySelectorAll('.quick-btn').forEach(b => { b.disabled = true; b.style.opacity = .5; });
}

async function botType(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  $body.appendChild(div);
  scrollBottom();
  await sleep(600 + Math.random()*300);
  const t = document.getElementById('typing');
  if(t) t.remove();
}

function showInput(placeholder, type){
  $input.value = '';
  $input.placeholder = placeholder || 'Ketik di sini...';
  $input.type = type || 'text';
  $inputArea.classList.add('show');
  setTimeout(()=> $input.focus(), 200);
}
function hideInput(){ $inputArea.classList.remove('show'); }

function formatTglID(yyyymmdd){
  try {
    const d = new Date(yyyymmdd);
    return d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  } catch(e){ return yyyymmdd; }
}

async function showGreeting(){
  await botType();
  addMsg('bot', 
    'Shalom! 👋 Selamat datang di aplikasi <b>Lapor Sarpras GKPI JK Depok</b>.<br><br>' +
    'Saya akan bantu Bapak/Ibu lapor kerusakan/keluhan terkait sarana & prasarana gereja.<br><br>' +
    'Mulai lapor sekarang ya?<br><br>' +
    '⏱️ <i>Hanya butuh 30 detik.</i><br>' +
    '🔒 <i>Laporan bersifat anonim.</i>',
    [{ label:'🚀 Mulai Lapor', cls:'primary', onClick: askTanggal }]
  );
}

async function askTanggal(){
  state = 'tanggal';
  await botType();
  addMsg('bot', '📅 Kapan kejadian / kerusakannya?', [
    { label:'Hari ini', onClick: ()=> setTanggal('today') },
    { label:'Kemarin', onClick: ()=> setTanggal('yesterday') },
    { label:'Pilih tanggal lain', onClick: ()=> setTanggal('custom') }
  ]);
}
function setTanggal(mode){
  const d = new Date();
  if(mode === 'today'){
    formData.tanggal = d.toISOString().split('T')[0];
    addMsg('user', 'Hari ini');
    askLokasi();
  } else if(mode === 'yesterday'){
    d.setDate(d.getDate()-1);
    formData.tanggal = d.toISOString().split('T')[0];
    addMsg('user', 'Kemarin');
    askLokasi();
  } else {
    addMsg('user', 'Pilih tanggal lain');
    showInput('YYYY-MM-DD atau pilih dari kalender', 'date');
    state = 'tanggal-custom';
  }
}

async function askLokasi(){
  state = 'lokasi';
  hideInput();
  await botType();
  const buttons = LOKASI_LIST.map(loc => ({ label: loc, onClick: ()=> setLokasi(loc) }));
  buttons.push({
    label:'📝 Tulis lokasi lain...',
    cls:'primary',
    onClick: ()=> {
      addMsg('user', 'Tulis lokasi lain');
      showInput('Contoh: Tangga lantai 2', 'text');
      state = 'lokasi-custom';
    }
  });
  addMsg('bot', '📍 Di mana lokasinya?<br><span class="small">Pilih dari daftar atau tulis sendiri.</span>', buttons);
}
function setLokasi(loc){
  formData.lokasi = loc;
  addMsg('user', escapeHtml(loc));
  askDeskripsi();
}

async function askDeskripsi(){
  state = 'deskripsi';
  hideInput();
  await botType();
  addMsg('bot', 
    '📝 Apa kerusakan / masalahnya?<br>' +
    '<span class="small">Tuliskan sejelas mungkin agar tim Sarpras bisa cepat tindak lanjut.<br>' +
    'Contoh: "AC tidak dingin sejak 2 hari" atau "Speaker mengeluarkan suara berisik"</span>'
  );
  showInput('Ketik deskripsi kerusakan...');
}

async function askPrioritas(){
  state = 'prioritas';
  hideInput();
  await botType();
  const buttons = PRIORITAS_LIST.map(p => ({
    label: p.label + ' <span style="opacity:.7; font-size:.75rem;">(' + p.desc + ')</span>',
    cls: p.cls,
    onClick: ()=> setPrioritas(p.val)
  }));
  addMsg('bot', '⚡ Seberapa mendesak?<br><span class="small">Pilih level prioritas yang paling sesuai.</span>', buttons);
}
function setPrioritas(p){
  formData.prioritas = p;
  addMsg('user', p);
  showReview();
}

async function showReview(){
  state = 'review';
  await botType();
  const reviewHtml = 
    '✅ <b>Review Laporan</b><br>' +
    '<span class="small">Mohon cek sekali lagi sebelum kirim.</span>' +
    '<div class="review-card">' +
      '<div class="row"><div class="lbl">📅 Tanggal</div><div class="val">' + formatTglID(formData.tanggal) + '</div></div>' +
      '<div class="row"><div class="lbl">📍 Lokasi</div><div class="val">' + escapeHtml(formData.lokasi) + '</div></div>' +
      '<div class="row"><div class="lbl">📝 Deskripsi</div><div class="val">' + escapeHtml(formData.deskripsi) + '</div></div>' +
      '<div class="row"><div class="lbl">⚡ Prioritas</div><div class="val">' + formData.prioritas + '</div></div>' +
    '</div>';
  
  addMsg('bot', reviewHtml, [
    { label:'✅ Kirim Laporan', cls:'success', onClick: submitLapor },
    { label:'✏️ Edit Ulang', onClick: editForm },
    { label:'❌ Batal', cls:'danger', onClick: cancelForm }
  ]);
}

async function submitLapor(){
  state = 'submit';
  await botType();
  addMsg('bot', '⏳ Sedang mengirim laporan ke tim Sarpras...');
  
  if(!LAPOR_API_URL || LAPOR_API_URL.includes('PASTE_DEPLOYMENT_URL')){
    showResult('error', '⚠️ Konfigurasi belum lengkap', 'API URL belum di-set di file lapor-bot.html.<br>Hubungi admin.');
    return;
  }
  
  try {
    const payload = {
      action: 'lapor',
      apikey: LAPOR_API_KEY,
      tanggal: formData.tanggal,
      lokasi: formData.lokasi,
      deskripsi: formData.deskripsi,
      prioritas: formData.prioritas
    };
    
    const params = new URLSearchParams();
    Object.keys(payload).forEach(k => params.append(k, payload[k]));
    
    const res = await fetch(LAPOR_API_URL, { method: 'POST', body: params });
    const result = await res.json();
    
    if(result.status === 'success'){
      showResult('success', '🎉 Laporan Terkirim!', 
        '<div class="no">#' + (result.no || '?') + '</div>' +
        'Terima kasih atas laporannya.<br>' +
        'Tim Sarpras GKPI akan tindak lanjut <b>dalam 1×24 jam</b>.');
    } else {
      throw new Error(result.message || 'Unknown error');
    }
  } catch(err) {
    showResult('error', '❌ Gagal Mengirim', 
      'Maaf, terjadi kesalahan:<br><code>' + err.message + '</code><br><br>' +
      'Silakan coba lagi atau hubungi admin.');
  }
}

function showResult(type, title, html){
  const $overlay = document.getElementById('resultOverlay');
  const $card = document.getElementById('resultCard');
  const icon = type === 'success' ? '✅' : '⚠️';
  
  $card.innerHTML = 
    '<div class="icon">' + icon + '</div>' +
    '<h3>' + title + '</h3>' +
    '<p>' + html + '</p>' +
    '<div class="btn-row">' +
      (type === 'success' 
        ? '<button class="quick-btn primary" onclick="resetForm()">📝 Lapor Lagi</button>' +
          '<button class="quick-btn" onclick="closeApp()">Tutup</button>'
        : '<button class="quick-btn primary" onclick="closeOverlay(); submitLapor()">🔄 Coba Lagi</button>' +
          '<button class="quick-btn" onclick="closeOverlay()">Tutup</button>'
      ) +
    '</div>';
  
  $overlay.classList.add('show');
}
function closeOverlay(){ document.getElementById('resultOverlay').classList.remove('show'); }

async function editForm(){
  await botType();
  addMsg('bot', 'OK, mari kita ulang dari awal. 🔄');
  formData = { tanggal:'', lokasi:'', deskripsi:'', prioritas:'' };
  askTanggal();
}
async function cancelForm(){
  addMsg('user', 'Batal');
  await botType();
  addMsg('bot', 'OK, laporan dibatalkan. Kalau berubah pikiran, tap tombol di bawah ya. 👇', [
    { label:'🚀 Mulai Lagi', cls:'primary', onClick: ()=> { formData = { tanggal:'', lokasi:'', deskripsi:'', prioritas:'' }; askTanggal(); } }
  ]);
}
function resetForm(){
  closeOverlay();
  $body.innerHTML = '';
  formData = { tanggal:'', lokasi:'', deskripsi:'', prioritas:'' };
  showGreeting();
}
function closeApp(){
  closeOverlay();
  $body.innerHTML = '';
  addMsg('bot', '🙏 Terima kasih telah menggunakan Lapor Sarpras GKPI.<br>Tuhan memberkati pelayanan kita semua.', [
    { label:'🚀 Lapor Lagi', cls:'primary', onClick: resetForm }
  ]);
}

function handleInputSubmit(){
  const val = $input.value.trim();
  if(!val) return;
  
  if(state === 'tanggal-custom'){
    formData.tanggal = val;
    addMsg('user', formatTglID(val));
    hideInput();
    askLokasi();
  } else if(state === 'lokasi-custom'){
    if(val.length < 3){ alert('Lokasi minimal 3 karakter'); return; }
    formData.lokasi = val;
    addMsg('user', escapeHtml(val));
    hideInput();
    askDeskripsi();
  } else if(state === 'deskripsi'){
    if(val.length < 5){ alert('Deskripsi minimal 5 karakter'); return; }
    formData.deskripsi = val;
    addMsg('user', escapeHtml(val));
    hideInput();
    askPrioritas();
  }
}
$input.addEventListener('keypress', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    handleInputSubmit();
  }
});

showGreeting();
</script>
</body>
</html>
